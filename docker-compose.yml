services:
  postgres:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wasanni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wasanni}
      POSTGRES_DB: ${POSTGRES_DB:-wasanni}
    ports: ["5440:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wasanni} -d ${POSTGRES_DB:-wasanni}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 2gb
      - --maxmemory-policy
      - noeviction
    ports: ["6390:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:4.8
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      LS_LOG: warn
    ports: ["4566:4566"]
    volumes:
      - localstackdata:/var/lib/localstack
      - ./scripts/localstack:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
  localstackdata:

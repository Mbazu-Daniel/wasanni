services:
  postgres-pgdog:
    image: ${PGDOG_IMAGE}
    restart: unless-stopped
    # Required: the image's default entrypoint is not the pgdog binary
    command: ["/usr/local/bin/pgdog", "run", "-p", "${PGDOG_POOL_SIZE}"]
    # Uncomment 'ports' settings below to enable external access
    # ports:
    #   - "6432:6432"
    volumes:
      - ../files/pgdog.toml:/pgdog/pgdog.toml
      - ../files/users.toml:/pgdog/users.toml
    environment:
      - RUST_LOG=${RUST_LOG}
    healthcheck:
      test: ["CMD-SHELL", "(echo > /dev/tcp/127.0.0.1/6432) >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

name: API — Build and Publish

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/api/**"
      - "apps/realtime/**"
      - "apps/worker/**"
      - "packages/**"
      - "Dockerfile"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/api-ci.yml"

jobs:
  build-and-publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: |
          REPO_LC=${GITHUB_REPOSITORY,,}
          echo "REPO=${REPO_LC}" >> $GITHUB_ENV
          echo "PACKAGE_NAME=${REPO_LC##*/}" >> $GITHUB_ENV

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.REPO }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune untagged GHCR manifests
        uses: actions/delete-package-versions@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          package-name: ${{ env.PACKAGE_NAME }}
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 5

      # A missing webhook fails here on purpose: the image is pushed but nothing
      # deploys it, and a silent skip hides that until someone checks Dokploy.
      - name: Trigger Dokploy webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "::error::DOKPLOY_WEBHOOK_URL is not set; image pushed but nothing deployed"
            exit 1
          fi
          # Docker/GHCR apps need registry_package plus a matching tag. A bare
          # POST can return success while redeploying the cached local image.
          IMAGE="ghcr.io/${REPO}:${GITHUB_REF_NAME}"
          BODY=$(jq -nc \
            --arg url "$IMAGE" \
            --arg id "${GITHUB_SHA}" \
            --arg msg "CI deploy ${GITHUB_SHA:0:7} (${GITHUB_REF_NAME})" \
            '{
              head_commit: {id: $id, message: $msg},
              registry_package: {package_version: {package_url: $url}}
            }')
          RESP=$(curl -sS -w "\n%{http_code}" -X POST "$DOKPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: registry_package" \
            -d "$BODY")
          CODE=$(echo "$RESP" | tail -n1)
          BODY_OUT=$(echo "$RESP" | sed '$d')
          echo "Dokploy response ($CODE) for $IMAGE: $BODY_OUT"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            exit 22
          fi

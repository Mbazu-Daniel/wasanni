name: Web — Check, Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/web-ci.yml"

jobs:
  check-and-build:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck web
        run: bun run --cwd apps/web typecheck

      - name: Cloudflare build
        run: bun run --cwd apps/web cf:build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

  cf-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cloudflare build
        run: bun run --cwd apps/web cf:build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy to Cloudflare Workers
        run: bun run --cwd apps/web cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
          CF_COMPAT_DATE: ${{ vars.CF_COMPAT_DATE }}
          CF_ROUTES: ${{ vars.CF_ROUTES }}
          CF_WORKERS_DEV: ${{ vars.CF_WORKERS_DEV }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
